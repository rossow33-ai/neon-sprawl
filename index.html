</div><h1>PALM CITY</h1><p>Sun, neon and trouble in Palm City. Steal rides, fly planes from Palmetto International, run jobs, dodge the cops.<br>Touch: joystick left, buttons right. Keys: WASD/Arrows, E/Enter = enter/exit, Space = handbrake (car) / fire (plane), F = fire.</p><button id="go">PLAY</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',rs);rs();
['touchmove','gesturestart','dblclick'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
// city
const T=64,BL=6,RW=2,N=8,PER=BL+RW,SZ=N*PER,WS=SZ*T;let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const grid=[];const bcol=[];
for(let y=0;y<SZ;y++){grid[y]=[];for(let x=0;x<SZ;x++){const rx=x%PER>=BL,ry=y%PER>=BL;grid[y][x]=rx||ry?0:((x%PER==0||y%PER==0||x%PER==BL-1||y%PER==BL-1)?1:2)}}
const PAST=[330,180,45,280,160,15,200,300];for(let i=0;i<N*N;i++)bcol.push(`hsl(${PAST[(rnd()*8)|0]},${55+rnd()*25|0}%,${68+rnd()*12|0}%)`);
// ocean east, beach, island + causeway, airport SW
const BEACH0=48,SEA0=51,AX1=37,AY0=40,RWY=[[45,47],[57,59]];
for(let y=0;y<SZ;y++)for(let x=0;x<SZ;x++){
 if(x>=SEA0)grid[y][x]=4;else if(x>=BEACH0)grid[y][x]=5;
 if(x>=56&&x<=61&&y>=16&&y<=29)grid[y][x]=(x==56||x==61||y==16||y==29)?1:((y>=21&&y<=24)?0:2);
 if(y>=22&&y<=23&&x>=BEACH0&&x<56)grid[y][x]=8;
 if(y>=38&&y<=39&&x>=BEACH0&&x<52)grid[y][x]=8;
 if(x<=AX1&&y>=AY0){grid[y][x]=6;for(const r of RWY)if(y>=r[0]&&y<=r[1]&&x>=1&&x<=AX1-1)grid[y][x]=7;
  if(x>=3&&x<=14&&y>=51&&y<=54)grid[y][x]=9;}
}
